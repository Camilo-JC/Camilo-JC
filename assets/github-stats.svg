    <linearGradient id="gsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C50337" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#666666" stop-opacity="0.45"/>
