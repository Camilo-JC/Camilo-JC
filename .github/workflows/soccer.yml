name: Generar Futbolista

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar animacion de futbol
        uses: Platane/snk@v3
        with:
          github_user_name: Camilo-JC
          outputs: |
            dist/soccer-grid-snake.svg
            dist/soccer-grid-snake-dark.svg?palette=github-dark
          
      - name: Subir imagen a la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
