name: Generate Datas

on:
  schedule: # Ejecutar automáticamente cada 24 horas
    - cron: "0 0 * * *" 
  workflow_dispatch: # Permitir ejecución manual desde la interfaz
  push:
    branches:
    - main # O 'master' si es tu rama principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          # Tu usuario de GitHub
          github_user_name: Camilo-JC 
          
          # Dónde se guardarán los archivos generados
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif
            
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Se creará una rama llamada 'output' donde vivirán las imágenes
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
